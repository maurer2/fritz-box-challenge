packages:
  - 'experiments/*'

allowBuilds:
  msw: true
  unrs-resolver: true
  esbuild: true

minimumReleaseAge: 10080 # 7 days
minimumReleaseAgeExcludePrune: true # drop entries from minimumReleaseAgeExclude upon install if they are old enough
blockExoticSubdeps: true # no git branch as package url

minimumReleaseAgeExclude:
  - 'rolldown'
  - '@oxc-project/types'
  - '@vitejs/plugin-react'
  - '@tanstack/redact@0.2.3'

supportedArchitectures:
  cpu:
    - arm64
    - x64
  os:
    - darwin
    - linux
    - win32
